# Proceso programado de SIREA en la nube (alternativa al contenedor "programador").
# Streamlit Community Cloud solo ejecuta la web; esta tarea de GitHub Actions corre
# un ciclo del programador cada 15 minutos: cierre de corte, recordatorios, respaldos y
# (SIREA 3.0) la corrida diaria del Agente Operativo, que solo PROPONE acciones.
# El código tolera la demora: si un recordatorio "venció", lo envía en el siguiente ciclo.
#
# Requiere los MISMOS secretos que Streamlit Cloud, cargados en GitHub:
#   repositorio → Settings → Secrets and variables → Actions → New repository secret
# (al menos SUPABASE_URL, SUPABASE_KEY, EMAIL_REMITENTE, EMAIL_PASSWORD, EMAIL_ADMINS,
#  GOOGLE_DRIVE_FOLDER_ID, GOOGLE_DRIVE_FOLDER_BACKUPS_ID, GOOGLE_CREDENTIALS_JSON).
name: SIREA - proceso programado

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sirea-programador
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Lima
      STORAGE_MODE: drive
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_DUPLICADOS_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_DUPLICADOS_ID }}
      GOOGLE_DRIVE_FOLDER_BACKUPS_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_BACKUPS_ID }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_NOMBRE_MOSTRAR: ${{ secrets.EMAIL_NOMBRE_MOSTRAR }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      EMAIL_ADMINS: ${{ secrets.EMAIL_ADMINS }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      SUPERADMIN_PRINCIPAL: ${{ secrets.SUPERADMIN_PRINCIPAL || 'oiis.winepi' }}
      AUDITORIA_COPIA_EMAIL: ${{ secrets.AUDITORIA_COPIA_EMAIL }}
      # SIREA 3.0: Agente Operativo (si faltan, el agente no corre con IA; nada se envía sin aprobación)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      IA_PROVEEDOR_ORDEN: ${{ secrets.IA_PROVEEDOR_ORDEN || 'gemini,groq' }}
      AGENTE_HORA: ${{ secrets.AGENTE_HORA || '9' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.programador --una-vez
