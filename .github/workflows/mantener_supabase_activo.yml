# SIREA · Robot de actividad en GitHub (no depende de que una PC esté encendida).
# Cada 2 días hace una consulta mínima a Supabase para que el proyecto (plan gratuito) no se pause.
# Configure en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL      https://xxxx.supabase.co
#   SUPABASE_ANON_KEY la clave PÚBLICA (anon / sb_publishable_…). NO use la clave secreta aquí.
#   SIREA_APP_URL     (opcional) dirección pública de SIREA
# Si una ejecución falla, GitHub le envía un correo al dueño del repositorio.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "23 13 */2 * *"   # cada 2 días, 08:23 hora de Lima
  workflow_dispatch: {}        # botón «Run workflow» para probarlo a mano

permissions:
  contents: read

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Latido a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SIREA_LATIDO_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIREA_APP_URL: ${{ secrets.SIREA_APP_URL }}
        run: python scripts/mantener_activo.py
